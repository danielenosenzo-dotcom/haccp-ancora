services:
  lettore-celle:
    # Scarica e costruisce direttamente da GitHub: non serve copiare file sul NAS.
    build: https://github.com/danielenosenzo-dotcom/haccp-ancora.git#main:nas-telecamera
    container_name: lettore-celle
    restart: unless-stopped
    environment:
      CONFIG_PATH: /config/config.json
    volumes:
      # Cartella sul NAS con config.json — le credenziali restano solo li,
      # non entrano nell'immagine e non finiscono su GitHub.
      - /share/Public/lettore-celle:/config:ro
