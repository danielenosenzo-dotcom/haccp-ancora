name: Watchdog — controllo sincronizzazione temperature

# Volutamente separato dal workflow di sync: se quello si rompe, questo
# continua a girare e avvisa. Non tocca eWeLink, legge solo il battito su Firestore.
on:
  schedule:
    - cron: '35 * * * *'   # ogni ora, sfasato rispetto al sync
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Controlla battito sincronizzazione
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node .github/scripts/watchdog-sync.js
