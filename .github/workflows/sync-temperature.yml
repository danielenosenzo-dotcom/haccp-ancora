name: Sync Temperature eWeLink → Firebase

on:
  schedule:
    # Chiediamo ogni 10 minuti pur volendo una lettura oraria: il cron di GitHub
    # sul piano gratuito salta molti giri e ha consegnato anche dopo 189 minuti.
    # Chiedendo spesso, anche scartando la maggior parte dei tentativi il dato
    # resta fresco. Il repo e pubblico: i minuti di esecuzione non si pagano.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install firebase-admin
      - name: Sync temperatures
        env:
          EWELINK_APP_ID: ${{ secrets.EWELINK_APP_ID }}
          EWELINK_APP_SECRET: ${{ secrets.EWELINK_APP_SECRET }}
          EWELINK_ACCESS_TOKEN: ${{ secrets.EWELINK_ACCESS_TOKEN }}
          EWELINK_REFRESH_TOKEN: ${{ secrets.EWELINK_REFRESH_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: node .github/scripts/sync-temperature.js
